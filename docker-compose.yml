services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: transactions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transactions"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/transactions
      PROCESSING_DELAY_SECONDS: ${PROCESSING_DELAY_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
